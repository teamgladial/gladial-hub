content:
  - name: homepage
    label: Homepage
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: eyebrow
        label: Intro label
        type: string
      - name: headline
        label: Headline
        type: string
      - name: description
        label: Introduction
        type: text
  - name: verticals
    label: Gladial sections
    type: collection
    path: src/content/verticals
    filename: "{fields.slug}.md"
    view:
      primary: name
      fields: [name, url]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: url
        label: Website URL
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: order
        label: Display order
        type: number
